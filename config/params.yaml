/**:
  ros__parameters:
    scan_topic: /scan_light
    odom_topic: /odometry/filtered
    map_frame: map
    intensity_min: 200.0
    cluster_radius_m: 0.07
    # Same as static TF base_link -> laser in sem50.launch.py
    lidar_x: 0.6
    lidar_y: 0.0
    lidar_yaw: -3.14


lighthouse_node:
  ros__parameters:
    pose_topic: /light_pose
    max_dist_error: 0.08
    # Gate vs current odom: 0.5 blocked real snaps (~0.75 m). Allow lost-robot relocal.
    max_xy_error: 3.0
    max_pair_dist: 30.0
    min_votes: 2
    max_w: 0.3
    pose_variance_xy: 0.05
    pose_variance_yaw: 0.05

marker_mapper_node:
  ros__parameters:
    intensity_min: 205.0
    merge_radius_m: 0.25
    min_observations: 3
    max_range_m: 8.0
    output_file: /home/user/ros2_ws/src/reflector_lighthouse/config/markers.yaml
    enabled: true
    save_on_shutdown: true
    draw_max_speed: 0.1
